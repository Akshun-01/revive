# Revive stack: Postgres + backend + a Cloudflare quick tunnel that gives a public HTTPS URL.
#
#   docker compose up -d --build          # start everything
#   docker compose logs -f cloudflared    # find the public https://<name>.trycloudflare.com URL
#   docker compose down                   # stop (keeps data)
#   docker compose down -v                # stop and wipe the database
#
# Share the trycloudflare URL with the frontend (set NEXT_PUBLIC_API_BASE to it). No Redis:
# the backend does not use it (Postgres is the only stateful dependency).

services:
  postgres:
    image: postgres:16-alpine
    container_name: revive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revive
      POSTGRES_PASSWORD: revive
      POSTGRES_DB: revive
    # Host 5433 -> container 5432 (host 5432 is often taken by a local Postgres install).
    ports:
      - "5433:5432"
    volumes:
      - revive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revive -d revive"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: revive-backend
    restart: unless-stopped
    # Secrets (HF_TOKEN, LANGCHAIN_*, REVIVE_SECRET_KEY, ARGA_API_KEY) come from backend/.env.
    env_file:
      - ./backend/.env
    environment:
      # Override the DB URL for the compose network (service name + internal port).
      REVIVE_DATABASE_URL: postgresql://revive:revive@postgres:5432/revive
      REVIVE_DATA_SOURCE: ${REVIVE_DATA_SOURCE:-seed}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Public HTTPS URL for the backend without port-forwarding. The URL is printed in the logs.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: revive-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:8000
    depends_on:
      - backend

volumes:
  revive_pgdata:
